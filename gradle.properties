org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric — matched to the rest of the empire (warfront, cosmos, kinetics, missile_program
# are all on exactly these numbers; drifting one of them is how a load-compatibility
# failure gets introduced without anything looking wrong).
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

mod_version=0.1.0
maven_group=dev.lilkuzco

fabric_api_version=0.157.0+26.2

# The motion authority. Consumed, never vendored: one gravity for the whole empire.
kinetics_version=0.1.4

# Soft integrations. These are NOT compile dependencies — the bridges are reflection-only,
# exactly as warfront's own CosmosReconBridge is. The versions here only tell the dev-run
# staging where to find jars to test against.
warfront_version=0.3.1
cosmos_version=0.2.3
